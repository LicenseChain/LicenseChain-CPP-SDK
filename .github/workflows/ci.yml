name: CI
on:
  push:
    branches: [ main, develop, dev]
  pull_request:
    branches: [ main, develop, dev]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build -j$(nproc)
